[workspace]
resolver = "2"
members = [
    "crates/controller",
    "crates/monitoring",
    "crates/analytics",
    "crates/ml_engine",
    "crates/optimizer",
    "crates/resilience",
    "crates/metrics",
    "crates/dashboard_api",
    "crates/policy_engine",
    "crates/benchmarking",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustFlow-AI Team"]
license = "MIT"
repository = "https://github.com/rustflow-ai/core"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
hyper = "1.0"
config = "0.14"
prometheus = "0.13"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dashmap = "5.5"
parking_lot = "0.12"
bytes = "1.5"
