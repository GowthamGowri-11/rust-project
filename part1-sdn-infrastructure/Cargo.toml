[workspace]
resolver = "2"
members = [
    "crates/controller",
    "crates/topology",
    "crates/traffic_gen",
    "crates/network_core",
    "crates/shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustFlow-AI Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
dashmap = "5.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
