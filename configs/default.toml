[controller]
host = "0.0.0.0"
port = 6653
openflow_version = "1.3"

[monitoring]
ebpf_enabled = false
interval_ms = 1000

[ml_engine]
model_path = "/models/traffic_predictor.onnx"
batch_size = 32
num_threads = 4

[optimizer]
algorithm = "shortest_path"
rebalance_threshold = 0.8

[resilience]
failure_timeout_ms = 3000
backup_path_count = 2
auto_recovery = true

[api]
host = "0.0.0.0"
port = 8080

[metrics]
prometheus_port = 9090
export_interval_ms = 5000
